# Publica a landing em https://jam.jeitoagape.com.br (GitHub Pages) a cada push na main.
# Página estática sem build: o artefato leva só o que o site serve (README/CLAUDE.md ficam de fora).
name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Monta a pasta publicada
        run: |
          mkdir _site
          cp index.html robots.txt sitemap.xml CNAME _site/
          cp -r assets _site/
          rm -f _site/assets/.gitkeep
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
